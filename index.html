<body>
  <div class="app">
    <header class="topbar">
      <div><div class="brand">同行</div><div class="tagline">清楚流程 · 公平配對</div></div>
      <div class="sim-pill">SIMULATION ONLY</div>
    </header>
    <aside class="warning" aria-label="模擬用途提醒">
      <span class="warning-label">只供模擬</span>
      <div class="warning-copy"><div class="warning-title">沒有真實叫車或收費</div><p>無定位、通知、個人資料或後端服務；所有地點與身份均為虛構。</p></div>
    </aside>
    <main class="scroll-area" id="scrollArea" tabindex="0"><div class="content" id="screen" aria-live="polite"></div></main>
    <nav class="tabbar" aria-label="主要頁面">
      <button class="tab" data-action="tab" data-value="passenger" role="tab" aria-selected="true"><span class="tab-indicator"></span><span>乘客版</span></button>
      <button class="tab" data-action="tab" data-value="driver" role="tab" aria-selected="false"><span class="tab-indicator"></span><span>司機版</span></button>
      <button class="tab" data-action="tab" data-value="simulator" role="tab" aria-selected="false"><span class="tab-indicator"></span><span>情境測試</span></button>
    </nav>
  </div>
  <script>
    'use strict';
    // All sample state lives in this page's memory only. No storage, network, GPS, or APIs.
    const PICKUPS=['示意上車點 A','示意上車點 C','示意上車點 E'];
    const DESTINATIONS=['示意目的地 B','示意目的地 D','示意目的地 F'];
    const STATUS={matching:'配對中（模擬）',accepted:'司機已接（模擬）',arrived:'司機已抵達（模擬）','in-progress':'行程進行中（模擬）',completed:'行程已完成（模擬）','cancelled-before-accept':'接單前已取消（模擬）','cancelled-after-accept':'接單後已取消（模擬）','review-pending':'待人工覆核（模擬）'};
    const SCENARIOS=[
      {id:'normal',title:'正常配對及完成',description:'由乘客建立假行程，模擬司機接受、抵達、開始及完成。'},
      {id:'decline',title:'拒絕不受懲罰',description:'拒絕後維持配對中；排序示意分數不變，沒有扣分。'},
      {id:'full-route',title:'接單前查看完整路線',description:'司機接受前可見起點、中途點及目的地。'},
      {id:'cancel-before',title:'接單前取消',description:'保留取消狀態；不產生金額或付款。'},
      {id:'cancel-after',title:'接單後取消',description:'記錄接單後取消；不自動收費。'},
      {id:'no-show',title:'未出現爭議',description:'只進入待人工覆核；不自動判責或扣款。'},
      {id:'wait',title:'模擬等候五分鐘',description:'只快轉本機假時間；不計等候費或自動扣款。'}
    ];
    const ADVERSARIAL_SCENARIOS = [
      {id:'normal', title:'正常叫車', short:'建立 → 接單 → 完成', summary:'由乘客建立假行程，司機接受並完成；全程無真實交易。', expected:['建立後進入「配對中」','只由一位模擬司機接單','行程依序到達、開始及完成','全程沒有付款或真實通知'], steps:[
        {title:'建立模擬行程', desc:'以乘客甲及示意起點 A → 示意目的地 B 建立一張假行程。', run:s=>{s.trip='SIM-RIDE-001';s.phase='matching';s.driver=null;event('建立假行程 SIM-RIDE-001；狀態：配對中。');}},
        {title:'模擬司機甲接受', desc:'由假司機甲接受配對邀請。', run:s=>{s.driver='司機甲';s.phase='accepted';s.accepts=1;event('司機甲接受假行程；唯一接單數：1。');}},
        {title:'模擬司機抵達', desc:'把行程推進至「已抵達」。', run:s=>{s.phase='arrived';event('司機甲已抵達示意上車點（虛擬狀態）。');}},
        {title:'模擬開始行程', desc:'乘客甲上車；只更新頁面內的假狀態。', run:s=>{s.phase='in_trip';event('行程進入「進行中」；無 GPS、無聯絡功能。');}},
        {title:'模擬完成', desc:'結束假行程，不產生金額或付款。', run:s=>{s.phase='completed';s.charge=0;event('假行程完成；付款／收費：無。');}}
      ], verify:s=>[['已有假行程',s.trip==='SIM-RIDE-001'],['唯一司機接單',s.accepts===1&&s.driver==='司機甲'],['狀態已完成',s.phase==='completed'],['沒有任何收費',s.charge===0]]},
      {id:'multistop', title:'多站行程', short:'保留所有中途站次序', summary:'演練兩個中途點的行程建立、司機查看及接受。', expected:['兩個假中途點均保留','中途點順序沒有改變','司機接受前可查看完整路線','無真實地圖或收費'], steps:[

    function h(value){return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
    function isActive(ride){return !!ride&&['matching','accepted','arrived','in-progress'].includes(ride.status);}
    function title(text,sub){return `<div class="section-title"><h1>${h(text)}</h1><p>${h(sub)}</p></div>`;}

    function sketch(){return `<div class="route-sketch" role="img" aria-label="示意路線圖，不代表真實地點或地圖"><div class="road"></div><div class="road road-two"></div><div class="route-line"></div><span class="point point-a">A</span><span class="point point-c">C</span><span class="point point-b">B</span><span class="sketch-caption">示意圖 · 非地圖 · 非定位</span></div>`;}

    function details(rows){return `<div class="detail-rows">${rows.map(([a,b])=>`<div class="detail-row"><span>${h(a)}</span><span>${h(b)}</span></div>`).join('')}</div>`;}
    function statusPill(ride){const review=ride.status==='review-pending';return `<span class="status ${review?'review':''}"><i class="status-dot"></i>${h(STATUS[ride.status])}</span>`;}
    function rideCard(ride){return `<article class="ride-card"><div class="ride-head"><span class="ride-id">${h(ride.id)}</span>${statusPill(ride)}</div><div class="route-inner">${sketch()}${route(ride)}</div>${details([['乘客','乘客甲（假資料）'],['司機',ride.driver||'尚未接單'],['車牌',ride.driverPlate||'尚未分配'],['金額／付款','不設金額 · 不收費']])}${ride.reviewStatus?`<div class="notice amber">爭議狀態：${h(ride.reviewStatus)}；不自動判責或扣款。</div>`:''}${ride.waitedMinutes>0?`<div class="notice mint">已快轉虛擬等候 ${ride.waitedMinutes} 分鐘；無等候費。</div>`:''}</article>`;}

    function picker(label,values,selected,which){return `<div class="picker"><div class="label">${h(label)}</div><div class="chips">${values.map(value=>`<button class="chip" data-action="choose-${which}" data-value="${h(value)}" aria-pressed="${value===selected}">${h(value)}</button>`).join('')}</div></div>`;}

    function passenger(){const active=isActive(state.ride);return `${title('乘客版','揀選示意上車點及目的地，開始一段本機模擬流程。')}${sketch()}<section class="card form-card">${picker('上車點',PICKUPS,state.pickup,'pickup')}<div class="separator"></div>${picker('目的地',DESTINATIONS,state.destination,'destination')}<button class="toggle" data-action="toggle-stops" aria-pressed="${state.withStops}"><span class="checkbox ${state.withStops?'checked':''}">${state.withStops?'✓':''}</span><span>${state.withStops?'已加入兩個虛構中途點':'加入兩個虛構中途點（測試完整路線）'}</span></button><div class="notice mint">司機接單前可查看完整行程。此版不計價、不收費，亦無付費優先。</div>${button(active?'目前有一張進行中的假行程':'建立模擬行程','create','primary',active)}${!active&&state.ride?'<p class="helper">上一筆假行程已結束；可建立下一筆測試行程。</p>':''}</section>${rideSection(state.ride)}`;}
    function driver(){const ride=state.ride;if(!ride)return `${title('司機版','模擬持牌的士司機收到一張假邀請。')}<section class="empty-card"><h2 class="empty-title">暫無假邀請</h2><p class="empty-text">先到「乘客版」建立一張示意行程，再返嚟測試司機流程。</p></section><div class="notice mint">本機展示資料只供流程測試，並非真實司機、車輛或訂單。</div>`;
      const canAccept=ride.status==='matching',accepted=ride.status==='accepted',arrived=ride.status==='arrived',inProgress=ride.status==='in-progress';
      const top=`${title('司機版','先睇完整假行程，再決定接受或拒絕。')}<section class="card availability"><div class="availability-mark">✓</div><div><div class="availability-title">可查看新邀請</div><div class="availability-sub">離線模擬 · 不使用定位</div></div><span class="sim-small">SIM</span></section>`;
      if(canAccept){const next=ride.declinedCount>0?'司機乙（假資料）':'司機甲（假資料）';return `${top}<section class="offer-card"><div class="offer-eyebrow">新行程邀請 · ${h(ride.id)}</div><h2 class="offer-title">先查看完整路線</h2><div class="route-inner">${sketch()}${route(ride)}</div>${details([['預計行程','只作假資料示意'],['中途點',ride.via.length?`${ride.via.length} 個（全部已顯示）`:'沒有'],['車費／付款','此原型不計價']])}<div class="button-row"><button class="button primary" data-action="accept" data-value="${h(next)}">接受 · ${h(next)}</button>${button('拒絕此邀請','decline','secondary')}</div>${ride.declinedCount?`<div class="notice mint">已拒絕 ${ride.declinedCount} 次；排序分數仍為 ${ride.rankAfter}，不扣分、不降序。</div>`:''}<p class="helper">拒絕只結束今次邀請，不會影響日後接單；沒有付費優先。</p></section>${eventLog(ride)}`;}
      let actions='';if(accepted)actions=button('模擬司機已抵達','arrive');if(arrived)actions=`<div class="action-stack">${button('開始模擬行程','start')}${button('模擬等候五分鐘（不收費）','wait','secondary')}${button('標記乘客未出現 → 待人工覆核','no-show','secondary')}<p class="helper">等候及未出現爭議均不會自動判責或扣款。</p></div>`;if(inProgress)actions=button('完成模擬行程','complete');
      return `${top}${rideCard(ride)}${actions}${ride.status==='review-pending'?'<div class="notice amber">只保留待人工覆核狀態；本機不會作出裁決或收費。</div>':''}${eventLog(ride)}`;
    }
    function checksFor(id,ride){if(!ride)return [{label:'已載入假行程',passed:false}];const noCharge=ride.chargedAmount===0&&ride.autoCharge===false;switch(id){case'normal':return[{label:'流程完成',passed:ride.status==='completed'},{label:'由一位假司機接單',passed:ride.driver!==null},{label:'沒有付款或收費',passed:noCharge}];case'decline':return[{label:'拒絕後仍可配對',passed:ride.status==='matching'},{label:'拒絕前後排序分數一致',passed:ride.rankBefore===ride.rankAfter},{label:'沒有拒絕懲罰',passed:ride.declinedCount===1}];case'full-route':return[{label:'司機可見完整路線',passed:ride.via.length===2&&!!(ride.pickup&&ride.destination)},{label:'中途點順序保留',passed:ride.via.join('|')==='示意中途點 C1|示意中途點 C2'},{label:'接受前已查看',passed:ride.events.some(e=>e.includes('接受前已查看'))}];case'cancel-before':return[{label:'接單前取消已記錄',passed:ride.status==='cancelled-before-accept'},{label:'沒有費用',passed:noCharge}];case'cancel-after':return[{label:'接單後取消已記錄',passed:ride.status==='cancelled-after-accept'},{label:'沒有自動扣款',passed:noCharge}];case'no-show':return[{label:'狀態為待人工覆核',passed:ride.status==='review-pending'&&ride.reviewStatus==='待人工覆核'},{label:'沒有自動判責或收費',passed:noCharge}];case'wait':return[{label:'模擬等候五分鐘',passed:ride.waitedMinutes===5},{label:'沒有等候費或自動扣款',passed:noCharge}];default:return[];}}
    function results(){const scenario=SCENARIOS.find(s=>s.id===state.selectedScenario);if(!scenario||!quickTestRide)return '';const checks=checksFor(scenario.id,quickTestRide),passed=checks.filter(c=>c.passed).length,all=passed===checks.length;return `<section class="results-card"><div class="results-heading"><div><div class="results-title">${h(scenario.title)}</div><div class="results-meta">本次檢查：${passed}/${checks.length} 項通過</div></div><span class="result-badge ${all?'pass':''}">${all?'通過':'檢查中'}</span></div>${checks.map(c=>`<div class="check-row"><span class="check-mark ${c.passed?'pass':''}">${c.passed?'✓':'○'}</span><span>${h(c.label)}</span></div>`).join('')}${rideCard(quickTestRide)}${eventLog(quickTestRide)}</section>`;}
    function getAdversarialModel(id){if(!adversarialModels[id])adversarialModels[id]={done:0,started:false,state:{},events:[],status:'待測',checks:null,error:null};return adversarialModels[id];}
    function event(text,type='ok'){if(!activeAdversarialId)return;getAdversarialModel(activeAdversarialId).events.push({text:String(text),type});}
    function verifyAdversarial(scenario,model){try{return scenario.verify(model.state).map(([label,passed])=>({label,passed:!!passed}));}catch(error){return scenario.expected.map(label=>({label,passed:false}));}}
    function adversarialStatusClass(status){return status==='通過'?'pass':status==='未通過'?'fail':status==='進行中'?'active':'pending';}
    function testModeTabs(){return `<div class="test-mode-tabs" role="tablist" aria-label="情境測試類型"><button class="test-mode-tab" role="tab" aria-selected="${state.testMode==='quick'}" data-action="test-mode" data-value="quick">7 個快速流程</button><button class="test-mode-tab" role="tab" aria-selected="${state.testMode==='full'}" data-action="test-mode" data-value="full">27 項逐步測試</button></div>`;}
    function quickSimulatorView(){return `<section class="test-intro"><strong>7 個基本快速流程 · 獨立測試資料</strong><p>每個快速流程只用自己的沙盒假行程，不會改動乘客／司機版的目前行程；載入另一項只會替換快速測試結果。</p></section><div class="scenario-list">${SCENARIOS.map((s,i)=>`<div class="scenario ${state.selectedScenario===s.id?'selected':''}"><span class="scenario-no">${String(i+1).padStart(2,'0')}</span><div class="scenario-copy"><div class="scenario-title">${h(s.title)}</div><div class="scenario-description">${h(s.description)}</div></div><button class="load-button" data-action="scenario" data-value="${s.id}">載入</button></div>`).join('')}</div>${results()}${button('清除快速測試結果','clear-quick-test','secondary')}<p class="helper">快速流程及結果只用本機記憶體，重新載入會重設；通過不代表法規批准、正式營運或上架測試。</p>`;}
    function adversarialScenarioList(){const groups=[['basic','基本情境'],['complex','複雜情境']];return `<div class="adversarial-groups">${groups.map(([group,label])=>{const items=ADVERSARIAL_SCENARIOS.map((scenario,index)=>({scenario,index})).filter(x=>(x.scenario.group||'basic')===group);if(!items.length)return '';return `<section class="adversarial-group"><h2 class="adversarial-group-title">${label} <small>｜${items.length} 個</small></h2>${items.map(({scenario,index})=>{const model=getAdversarialModel(scenario.id);return `<div class="adversarial-item ${scenario.id===selectedAdversarial?'selected':''}"><span class="adversarial-no">${String(index+1).padStart(2,'0')}</span><div class="adversarial-item-copy"><div class="adversarial-item-title">${h(scenario.title)}</div><div class="adversarial-item-summary">${h(scenario.short)}</div><div class="adversarial-item-meta">${model.done}/${scenario.steps.length} 步 · <span class="adversarial-status ${adversarialStatusClass(model.status)}">${h(model.status)}</span></div></div><button class="adversarial-open" data-action="adverse-select" data-value="${h(scenario.id)}">${scenario.id===selectedAdversarial?'目前':'開啟'}</button></div>`}).join('')}</section>`}).join('')}</div>`;}
    function adversarialScenarioDetail(scenario){const model=getAdversarialModel(scenario.id),checks=model.done===scenario.steps.length?verifyAdversarial(scenario,model):null,current=model.done<scenario.steps.length?scenario.steps[model.done]:null;const plan=scenario.steps.map((step,index)=>`<div class="adversarial-step-row ${index<model.done?'done':index===model.done&&current?'current':''}"><strong>${index<model.done?'✓ ':''}${index+1}. ${h(step.title)}</strong><p>${h(step.desc)}</p></div>`).join('');const expected=scenario.expected.map((label,index)=>{const check=checks&&checks[index];return `<div class="adversarial-check"><span class="adversarial-check-mark ${check?(check.passed?'pass':'fail'):''}">${check?(check.passed?'✓':'✕'):'○'}</span><span>${h(label)}${check?' — '+(check.passed?'通過':'未通過'):''}</span></div>`}).join('');const events=model.events.length?model.events.map((item,index)=>`<div class="adversarial-event ${h(item.type)}"><span class="adversarial-event-index">${String(index+1).padStart(2,'0')}</span><span>${h(item.text)}</span></div>`).join(''):'<p class="helper">尚未有本輪事件。</p>';return `<section class="adversarial-selected-card"><div class="results-heading"><div><h2 class="adversarial-detail-title">${h(scenario.title)}</h2><div class="results-meta">${model.done}/${scenario.steps.length} 步完成 · ${model.status==='通過'?'全部檢查通過':model.status==='未通過'?'有檢查未通過':model.status==='進行中'?'測試進行中':'尚未開始'}</div></div><span class="adversarial-status ${adversarialStatusClass(model.status)}">${h(model.status)}</span></div><p class="adversarial-detail-summary">${h(scenario.summary)}</p><div class="notice mint">以下只執行逐步假資料斷言；不連網、不用真 GPS、不發通知、不建立真實行程或收費。</div><h3 class="adversarial-section-label">完整步驟</h3><div class="adversarial-step-plan">${plan}</div><section class="step-area"><div class="step-meta"><span>${current?`第 ${model.done+1} / ${scenario.steps.length} 步`:'情境操作'}</span><span>${model.done} 個步驟完成</span></div><h3>${current?h(current.title):model.done===scenario.steps.length?'本輪步驟已完成':'準備開始'}</h3><p>${current?h(current.desc):model.done===scenario.steps.length?'已完成全部步驟；下方列出自動驗證結果。':'按一次只執行一個本機假資料步驟。'}</p><div class="adversarial-action-row"><button class="button primary" data-action="adverse-step" ${current?'':'disabled'}>${!model.started?'開始情境':current?'執行下一步':'全部步驟完成'}</button><button class="button secondary" data-action="adverse-reset">重新開始／重播本情境</button></div></section><h3 class="adversarial-section-label">預期行為及本輪檢查</h3><div class="adversarial-checks">${expected}</div>${model.error?`<div class="notice amber">本步驟出現內部錯誤：${h(model.error)}。請重設本情境再試。</div>`:''}<h3 class="adversarial-section-label">本輪模擬事件</h3><div class="adversarial-events">${events}</div><p class="helper">通過只表示這份離線頁面的假資料模型符合自身斷言；不是實際併發、伺服器、GPS、推送、法律或正式系統驗收。</p></section>`;}
    function adversarialSimulatorView(){const scenario=ADVERSARIAL_SCENARIOS.find(item=>item.id===selectedAdversarial)||ADVERSARIAL_SCENARIOS[0];const passed=ADVERSARIAL_SCENARIOS.filter(item=>getAdversarialModel(item.id).status==='通過').length;return `<section class="test-intro"><strong>27 項逐步情境 · ${passed}/27 項通過</strong><p>來源模擬器的實際步驟和 verify 斷言已搬入；10 個基本、17 個複雜情境。每項有獨立記憶體沙盒，切換測試或返回乘客／司機版都不會改動主行程。</p></section><div class="adversarial-grid">${adversarialScenarioList()}${adversarialScenarioDetail(scenario)}</div><button class="button secondary" data-action="adverse-reset-all">重設全部 27 項結果</button><p class="helper">所有進度只留在此頁記憶體，重新載入會清除；不儲存測試備註或個人資料。</p>`;}
    function simulator(){return `${title('情境測試','保留原有 7 個快速流程，或逐步演練來源模擬器的全部 27 項情境。')}${testModeTabs()}${state.testMode==='full'?adversarialSimulatorView():quickSimulatorView()}`;}
    function runAdversarialStep(){const scenario=ADVERSARIAL_SCENARIOS.find(item=>item.id===selectedAdversarial);if(!scenario)return;const model=getAdversarialModel(scenario.id);if(model.done>=scenario.steps.length||model.error)return;activeAdversarialId=scenario.id;try{if(!model.started){model.started=true;model.status='進行中';event('開始本輪假資料演練：'+scenario.title+'。')}scenario.steps[model.done].run(model.state);model.done++;if(model.done===scenario.steps.length){model.checks=verifyAdversarial(scenario,model);const passed=model.checks.every(check=>check.passed);model.status=passed?'通過':'未通過';event(passed?'自動檢查完成：全部預期行為通過。':'自動檢查完成：至少一項預期行為未通過。',passed?'ok':'bad')}}catch(error){model.error=String(error&&error.message||error).slice(0,180);model.status='未通過';event('步驟發生內部錯誤；重設後可重試。','bad')}finally{activeAdversarialId=null}}
    function resetAdversarial(id){adversarialModels[id]={done:0,started:false,state:{},events:[],status:'待測',checks:null,error:null};}
    function clearAllAdversarial(){ADVERSARIAL_SCENARIOS.forEach(scenario=>resetAdversarial(scenario.id));}

    function render(){screen.innerHTML=(state.tab==='passenger'?passenger():state.tab==='driver'?driver():simulator())+'<footer class="footer-note">法規書面確認前，本專案只限離線原型；不代表可營運的士配對服務。</footer>';tabButtons.forEach(btn=>btn.setAttribute('aria-selected',String(btn.dataset.value===state.tab)));}
    function initialState(){return {ride:null,nextRideNumber:1,pickup:PICKUPS[0],destination:DESTINATIONS[0]};}
    function createRide(s,via=[]){const n=String(s.nextRideNumber).padStart(3,'0');return {...s,ride:{id:`SIM-RIDE-${n}`,pickup:s.pickup,via:[...via],destination:s.destination,status:'matching',driver:null,driverPlate:null,declinedCount:0,rankBefore:72,rankAfter:72,waitedMinutes:0,reviewStatus:null,chargedAmount:0,autoCharge:false,events:['已建立本機假行程；只使用示意地點及虛構資料。']},nextRideNumber:s.nextRideNumber+1};}
    function append(ride,message,changes={}){return {...ride,...changes,events:[...ride.events,message]};}
    function accept(s,driver){if(!s.ride||s.ride.status!=='matching')return s;return {...s,ride:append(s.ride,`${driver}接受假行程；全程不產生費用。`,{status:'accepted',driver,driverPlate:'SIM-0001（虛構）'})};}
    function decline(s){if(!s.ride||s.ride.status!=='matching')return s;const count=s.ride.declinedCount+1;return {...s,ride:append(s.ride,`司機甲拒絕本次邀請；模擬排序分數維持 ${s.ride.rankAfter}，不扣分、不降序。`,{declinedCount:count,rankAfter:s.ride.rankBefore})};}
    function arrive(s){return !s.ride||s.ride.status!=='accepted'?s:{...s,ride:append(s.ride,'司機已到示意上車點；沒有讀取裝置位置。',{status:'arrived'})};}
    function start(s){return !s.ride||s.ride.status!=='arrived'?s:{...s,ride:append(s.ride,'行程進入模擬進行中；沒有導航或定位。',{status:'in-progress'})};}
    function complete(s){return !s.ride||s.ride.status!=='in-progress'?s:{...s,ride:append(s.ride,'假行程完成；本原型不設金額、付款或收費。',{status:'completed'})};}
    function cancel(s){if(!s.ride||!isActive(s.ride))return s;const before=s.ride.status==='matching',status=before?'cancelled-before-accept':'cancelled-after-accept',message=before?'乘客在接單前取消；已保留狀態，不收費。':'乘客在接單後取消；已保留狀態，不自動收費。';return {...s,ride:append(s.ride,message,{status,chargedAmount:0,autoCharge:false})};}
    function noShow(s){return !s.ride||s.ride.status!=='arrived'?s:{...s,ride:append(s.ride,'未出現只標記待人工覆核；不自動判責或收費。',{status:'review-pending',reviewStatus:'待人工覆核',chargedAmount:0,autoCharge:false})};}
    function wait(s){return !s.ride||s.ride.status!=='arrived'?s:{...s,ride:append(s.ride,'本機虛擬時間快轉五分鐘；等候費及自動扣款均不適用。',{waitedMinutes:5,chargedAmount:0,autoCharge:false})};}
    function runScenario(id){let s=initialState();if(id==='full-route'){s=createRide(s,['示意中途點 C1','示意中途點 C2']);s.ride=append(s.ride,'司機接受前已查看起點、中途點次序及目的地。');return accept(s,'司機甲（假資料）');}s=createRide(s);switch(id){case'normal':return complete(start(arrive(accept(s,'司機甲（假資料）'))));case'decline':return decline(s);case'cancel-before':return cancel(s);case'cancel-after':return cancel(accept(s,'司機甲（假資料）'));case'no-show':return noShow(arrive(accept(s,'司機甲（假資料）')));case'wait':return wait(arrive(accept(s,'司機甲（假資料）')));default:return s;}}
    document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action,value=el.dataset.value;
      if(action==='tab'){state.tab=value;document.getElementById('scrollArea').scrollTop=0;}
      else if(action==='choose-pickup')state.pickup=value;
      else if(action==='choose-destination')state.destination=value;
      else if(action==='toggle-stops')state.withStops=!state.withStops;
      else if(action==='create'&&!isActive(state.ride)){const via=state.withStops?['示意中途點 C1','示意中途點 C2']:[];Object.assign(state,createRide(state,via));}
      else if(action==='cancel')state.ride=cancel(state).ride;
      else if(action==='accept')state.ride=accept(state,value).ride;
      else if(action==='decline')state.ride=decline(state).ride;
      else if(action==='arrive')state.ride=arrive(state).ride;
      else if(action==='start')state.ride=start(state).ride;
      else if(action==='complete')state.ride=complete(state).ride;
      else if(action==='wait')state.ride=wait(state).ride;
      else if(action==='no-show')state.ride=noShow(state).ride;
      else if(action==='scenario'){quickTestRide=runScenario(value).ride;state.selectedScenario=value;}
      else if(action==='clear-quick-test'){quickTestRide=null;state.selectedScenario=null;}
      else if(action==='test-mode'){state.testMode=value;document.getElementById('scrollArea').scrollTop=0;}
      else if(action==='adverse-select'){selectedAdversarial=value;state.testMode='full';}
      else if(action==='adverse-step')runAdversarialStep();
      else if(action==='adverse-reset')resetAdversarial(selectedAdversarial);
      else if(action==='adverse-reset-all')clearAllAdversarial();
      render();
    });
    render();
  </script>
</body>
</html>
